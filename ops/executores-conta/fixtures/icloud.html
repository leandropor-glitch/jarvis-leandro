<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>FICTÍCIO — domínio personalizado</title></head>
<body>
<p>PÁGINA FICTÍCIA DE TESTE. Não é o iCloud.</p>
<div id="lista"></div>
<button data-acao="adicionar-endereco">Adicionar endereço</button>
<div id="form" hidden>
  <input name="endereco" placeholder="novo endereço">
  <button data-acao="confirmar">Adicionar</button>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.has('limite')) document.body.insertAdjacentHTML('beforeend', '<p data-estado="limite">Limite de 10 endereços atingido</p>');
  document.querySelector('[data-acao="adicionar-endereco"]').onclick = () => { document.getElementById('form').hidden = false; };
  document.querySelector('[data-acao="confirmar"]').onclick = () => {
    const v = document.querySelector('[name=endereco]').value;
    document.getElementById('lista').insertAdjacentHTML('beforeend', '<p data-estado="adicionado">' + v + '@dominio-ficticio.test</p>');
  };
</script>
</body></html>
