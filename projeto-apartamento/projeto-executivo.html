<style>
/* Layout: prancheta técnica — faixa de navegação fixa, folhas (pranchas) com carimbo, cotas em azul como na planta original */
:root{
  --paper:#f4f5f3; --sheet:#ffffff; --ink:#1b2124; --graphite:#5a646a; --rule:#d6dadb; --rule-2:#e8ebeb;
  --cota:#2a5ea8; --wood:#9a6232; --wood-soft:#f1e6da; --ref:#c4323b; --ok:#2f7a4f; --led:#d9a23b;
  --wall:#1b2124; --wall-int:#5a646a; --wall-str:#000000; --furn:#eef0ef; --furn-stroke:#8b959a;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111518; --sheet:#171c20; --ink:#e4e8ea; --graphite:#9aa5ab; --rule:#2c3439; --rule-2:#222a2f;
  --cota:#7ea8ea; --wood:#d39461; --wood-soft:#2b2219; --ref:#ef6b72; --ok:#6cc391; --led:#e8b955;
  --wall:#e4e8ea; --wall-int:#9aa5ab; --wall-str:#ffffff; --furn:#1f262b; --furn-stroke:#6d787e; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#111518; --sheet:#171c20; --ink:#e4e8ea; --graphite:#9aa5ab; --rule:#2c3439; --rule-2:#222a2f;
  --cota:#7ea8ea; --wood:#d39461; --wood-soft:#2b2219; --ref:#ef6b72; --ok:#6cc391; --led:#e8b955;
  --wall:#e4e8ea; --wall-int:#9aa5ab; --wall-str:#ffffff; --furn:#1f262b; --furn-stroke:#6d787e; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--graphite)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cota);outline-offset:2px}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:58px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:19px;font-weight:700;font-stretch:88%;white-space:nowrap}
.brand .mono{font-size:11.5px;color:var(--graphite)}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{border:1px solid transparent;background:none;padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--graphite)}
nav.tabs button:hover{color:var(--ink);background:var(--rule-2)}
nav.tabs button[aria-selected="true"]{color:var(--sheet);background:var(--ink)}
.view{padding-block:22px 64px}

/* ===== modelo 3D ===== */
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
.stage{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;min-height:420px;height:min(74vh,780px)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage .hud{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.stage .hud > *{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:color-mix(in srgb,var(--sheet) 88%,transparent);backdrop-filter:blur(6px);padding:5px 10px;border-radius:999px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.stage .caption{position:absolute;left:12px;bottom:12px;right:12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-end;pointer-events:none}
.stage .caption .t{background:color-mix(in srgb,var(--sheet) 90%,transparent);backdrop-filter:blur(6px);border:1px solid var(--rule);border-radius:var(--r);padding:8px 12px;max-width:min(520px,100%)}
.stage .caption .t b{font-family:var(--f-display);font-size:15px;display:block}
.stage .caption .t span{font-size:12.5px;color:var(--graphite)}
.stage .hint{font-size:11.5px;color:var(--graphite);background:color-mix(in srgb,var(--sheet) 85%,transparent);padding:4px 8px;border-radius:4px;white-space:nowrap}
.lbl3d{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:#1b2124;background:rgba(255,255,255,.86);padding:2px 6px;border-radius:3px;pointer-events:none;white-space:nowrap}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--graphite);font-family:var(--f-mono);font-size:12px}
.side{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px;max-height:min(74vh,780px);overflow:auto;min-width:0}
.side h3{font-size:13px;font-weight:600;font-stretch:100%;margin:14px 0 6px}
.side h3:first-child{margin-top:0}
.vlist{display:flex;flex-direction:column;gap:2px}
.vlist button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:13px}
.vlist button:hover{background:var(--rule-2)}
.vlist button[aria-current="true"]{background:var(--wood-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--wood)}
.vlist button .mono{font-size:11px;color:var(--graphite)}

/* ===== caderno ===== */
.cad{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;max-height:calc(100vh - 100px);overflow:auto}
.toc a{display:grid;grid-template-columns:28px 1fr auto;gap:6px;padding:6px 6px;border-radius:4px;color:var(--ink);text-decoration:none;font-size:13px}
.toc a:hover{background:var(--rule-2)}
.toc a .mono{color:var(--graphite);font-size:11px}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:28px;overflow:hidden}
.sheet-head{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:end;padding:18px 20px 14px;border-bottom:1px solid var(--rule)}
.sheet-head .code{font-family:var(--f-display);font-weight:800;font-stretch:75%;font-size:44px;line-height:.85;color:var(--wood)}
.sheet-head h2{font-size:24px;font-weight:700;font-stretch:92%}
.sheet-head p{margin:4px 0 0;color:var(--graphite);max-width:68ch}
.kv{display:flex;gap:18px;flex-wrap:wrap}
.kv div{display:flex;flex-direction:column}
.kv b{font-family:var(--f-mono);font-weight:500;font-size:15px}
.kv span{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--graphite)}
.sheet-body{padding:18px 20px 22px;display:grid;gap:22px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
figure{margin:0;min-width:0}
figure .ph{aspect-ratio:16/10;max-width:100%;background:var(--rule-2);border-radius:4px;overflow:hidden;position:relative;display:block;width:100%;border:0;padding:0;cursor:zoom-in}
figure .ph img{width:100%;height:100%;object-fit:cover;display:block}
figure .ph .wait{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--graphite)}
figcaption{font-size:12px;color:var(--graphite);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.plan-box{border:1px solid var(--rule);border-radius:4px;overflow-x:auto;background:var(--sheet)}
.plan-box svg{display:block;width:100%;height:auto;min-width:420px}
.layers{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.blk h3{font-size:15px;font-weight:650;font-stretch:95%;margin-bottom:8px;display:flex;align-items:baseline;gap:8px}
.blk h3 .mono{font-size:11px;color:var(--graphite);font-weight:400}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
th{font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite);background:var(--paper);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.code{font-family:var(--f-mono);font-size:12px;color:var(--cota);white-space:nowrap}
.sym{display:inline-block;vertical-align:middle;margin-right:6px}
ul.notes{margin:0;padding-left:18px;display:grid;gap:5px}
ul.notes li::marker{color:var(--wood)}
.qty{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.qty div{background:var(--sheet);padding:10px 12px}
.qty b{display:block;font-family:var(--f-mono);font-size:17px;font-weight:500}
.qty span{font-size:11.5px;color:var(--graphite)}

/* ===== pranchas ===== */
.prancha{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);display:grid;grid-template-columns:minmax(0,1fr) 300px}
.prancha .draw{padding:14px;overflow-x:auto;border-right:1px solid var(--rule)}
.prancha .draw svg{display:block;width:100%;height:auto;min-width:640px}
.carimbo{padding:16px;display:flex;flex-direction:column;gap:14px;font-size:12.5px}
.carimbo h2{font-size:22px;font-weight:750;font-stretch:85%}
.carimbo .row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--rule-2);padding-top:6px}
.legend{display:grid;gap:5px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12px}
.sheetsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

/* ===== memorial ===== */
.memo{display:grid;gap:24px}
.memo .sheet-body{gap:18px}
.gantt{display:grid;grid-template-columns:minmax(150px,260px) minmax(0,1fr);gap:6px 12px;font-size:12.5px;align-items:center}
.gantt .bar{position:relative;height:16px;background:var(--rule-2);border-radius:3px}
.gantt .bar i{position:absolute;top:0;bottom:0;background:var(--wood);border-radius:3px}
.gantt .weeks{display:grid;grid-template-columns:repeat(12,1fr);font-family:var(--f-mono);font-size:10px;color:var(--graphite)}
.callout{border:1px solid var(--rule);border-left:3px solid var(--ref);background:var(--paper);padding:12px 14px;border-radius:4px;font-size:13px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:40;background:rgba(10,12,14,.86);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:86vh;border-radius:4px}
.lb p{color:#e4e8ea;font-size:13px;margin:8px 0 0;text-align:center}

@media (max-width:1100px){.viewer{grid-template-columns:1fr}.side{max-height:none}.prancha{grid-template-columns:1fr}.prancha .draw{border-right:0;border-bottom:1px solid var(--rule)}}
@media (max-width:900px){.cad{grid-template-columns:1fr}.toc{position:static;max-height:none}.two{grid-template-columns:1fr}.sheet-head{grid-template-columns:auto 1fr}.sheet-head .kv{grid-column:1/-1}}
@media (max-width:520px){.brand .mono{display:none}.sheet-head .code{font-size:34px}.sheet-head h2{font-size:20px}.stage{height:62vh}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* impressão (usada para gerar o PDF) */
@media print{
  @page{size:A4 landscape;margin:10mm}
  html,body{background:#fff;color:#111}
  .top,.toc,.layers,.sheetsel,#v-modelo,.lb{display:none!important}
  .view{display:block!important;padding:0}
  .view[hidden]{display:block!important}
  .cad{display:block}
  .sheet,.prancha{break-inside:auto;border:0;margin:0 0 0;page-break-after:always}
  .sheet-body{gap:14px}
  .blk,.figs,.two>div{break-inside:avoid}
  .plan-box svg,.prancha .draw svg{min-width:0}
  .print-pranchas .prancha{page-break-after:always}
}

const f1 = v => v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const area = r => r.rects.reduce((a,[x1,y1,x2,y2])=>a+(x2-x1)*(y2-y1),0);
function perim(r){
  let p = r.rects.reduce((a,[x1,y1,x2,y2])=>a+2*((x2-x1)+(y2-y1)),0);
  for(let i=0;i<r.rects.length;i++)for(let j=i+1;j<r.rects.length;j++){
    const [a1,b1,a2,b2]=r.rects[i],[c1,d1,c2,d2]=r.rects[j];
    if(Math.abs(a2-c1)<1e-6||Math.abs(c2-a1)<1e-6) p-=2*Math.max(0,Math.min(b2,d2)-Math.max(b1,d1));
    if(Math.abs(b2-d1)<1e-6||Math.abs(d2-b1)<1e-6) p-=2*Math.max(0,Math.min(a2,c2)-Math.max(a1,c1));
  }
  return p;
}
const inRoom = (r,x,y,m=0)=>r.rects.some(([x1,y1,x2,y2])=>x>=x1-m&&x<=x2+m&&y>=y1-m&&y<=y2+m);
function roomOpenings(r){
  return OPENINGS.filter(o=>{const mid=(o.s+o.e)/2;return [-0.12,0.12].some(d=>o.a==='h'?inRoom(r,mid,o.c+d):inRoom(r,o.c+d,mid));});
}
const segLen = s => Math.hypot(s[2]-s[0],s[3]-s[1]);
function roomQty(r){
  const a=area(r), p=perim(r), ops=roomOpenings(r);
  const opA=ops.reduce((s,o)=>s+(o.e-o.s)*((o.head||2.1)-(o.sill||0)),0);
  const doorW=ops.filter(o=>o.t==='door'||o.t==='vao'||o.t==='pj').reduce((s,o)=>s+(o.e-o.s),0);
  const clad=(r.furn||[]).filter(f=>f.k==='clad').reduce((s,f)=>s+Math.max(f.w,f.d)*f.h,0);
  const led=(r.ilum||[]).filter(i=>i.seg).reduce((s,i)=>s+i.seg.reduce((t,g)=>t+segLen(g),0),0);
  const pts=(r.ilum||[]).filter(i=>i.p).reduce((s,i)=>s+i.p.length,0);
  const tom=(r.elet||[]).filter(e=>['tug','tue','ac'].includes(e.s)).reduce((s,e)=>s+e.p.length*(e.n||1),0);
  const wet=['P2','P3'].includes(r.piso);
  const parede=Math.max(0,p*r.forro-opA-clad);
  return {a,p,opA,doorW,rodape:Math.max(0,p-doorW),parede,clad,led,pts,tom,wet};
}

/* paredes com recortes */
function buildWalls(){
  for(const w of WALLS){
    const [x1,y1,x2,y2]=w.r; const horiz=(x2-x1)>=(y2-y1);
    const mat = w.t==='str'||w.t==='shaft'?M.str:M.wall;
    const ops = OPENINGS.filter(o=>o.a===(horiz?'h':'v') && o.c>=(horiz?y1:x1)-0.01 && o.c<=(horiz?y2:x2)+0.01 && o.s>=(horiz?x1:y1)-0.01 && o.e<=(horiz?x2:y2)+0.01).sort((a,b)=>a.s-b.s);
    let cur = horiz?x1:y1; const end = horiz?x2:y2;
    const piece=(a,b,z1,z2)=>{ if(b-a<0.001||z2-z1<0.001)return; horiz?box(a,y1,z1,b,y2,z2,mat,G.walls):box(x1,a,z1,x2,b,z2,mat,G.walls); };
    for(const o of ops){
      piece(cur,o.s,0,H);
      if(o.sill>0) piece(o.s,o.e,0,o.sill);
      piece(o.s,o.e,o.head,H);
      buildOpening(o,horiz?[y1,y2]:[x1,x2]);
      cur=o.e;
    }
    piece(cur,end,0,H);
  }
}
function buildOpening(o,[t1,t2]){
  const mid=(t1+t2)/2; const B=(a,b,za,zb,ta,tb,mat,cast=true)=>o.a==='h'?box(a,ta,za,b,tb,zb,mat,G.doors,cast):box(ta,a,za,tb,b,zb,mat,G.doors,cast);
  if(o.t==='win'||o.t==='pj'){

  for(const r of ROOMS){

    for(const [x1,y1,x2,y2] of r.rects){

        const s=r.piso==='P1'?[(x2-x1)/2.44,(y2-y1)/1.08]:r.piso==='P2'?[(x2-x1)/0.9,(y2-y1)/0.9]:[(x2-x1)/1.2,(y2-y1)/0.6];

      const g=new THREE.PlaneGeometry(x2-x1,y2-y1); const m=new THREE.Mesh(g,mat); m.rotation.x=-Math.PI/2; m.position.set((x1+x2)/2,0.001,(y1+y2)/2); m.receiveShadow=true; G.floors.add(m);

    }

  // varanda em arco

  for(let i=1;i<=N;i++){const y=ARC.y1+(ARC.y2-ARC.y1)*i/N;sh.lineTo(arcX(y),y);}

  const vg=new THREE.ShapeGeometry(sh); const vf=new THREE.Mesh(vg,vm); vf.rotation.x=Math.PI/2; vf.position.y=-0.015; vf.receiveShadow=true; G.floors.add(vf);

  const railPts=[]; for(let i=0;i<=N;i++){const y=ARC.y1+(ARC.y2-ARC.y1)*i/N;railPts.push([arcX(y)+0.04,y]);}
  railPts.unshift([-0.15,ARC.y1+0.03]); railPts.push([0.66,ARC.y2-0.03]);
  for(let i=0;i<railPts.length-1;i++){
    const [ax,ay]=railPts[i],[bx,by]=railPts[i+1]; const L=Math.hypot(bx-ax,by-ay); const ang=Math.atan2(by-ay,bx-ax);

  if(['cab','buffet','counter','peninsula','vanity','desk','counterTop'].includes(it.k)&&it.z!==undefined&&it.z>=1.4) return `<rect x="${P(it.x)}" y="${P(it.y)}" width="${P(it.w)}" height="${P(it.d)}" fill="none" stroke="var(--furn-stroke)" stroke-width="1" stroke-dasharray="5 4"/>`;

  if(it.mods>1){const horiz=!(it.f==='E'||it.f==='W');for(let i=1;i<it.mods;i++){s+=horiz?`<path d="M${P(it.x+i*it.w/it.mods)} ${P(it.y)}V${P(it.y+it.d)}" stroke="var(--furn-stroke)" stroke-width=".8"/>`:`<path d="M${P(it.x)} ${P(it.y+i*it.d/it.mods)}H${P(it.x+it.w)}" stroke="var(--furn-stroke)" stroke-width=".8"/>`;}}

  return s+extra;
}

function planSVG(opt){
  const {bounds=[-1.7,-0.6,9.5,8.95],layers={},focus=null,cotas=false}=opt;
  const [bx1,by1,bx2,by2]=bounds; const vb=`${P(bx1)} ${P(by1)} ${P(bx2-bx1)} ${P(by2-by1)}`;
  let s=`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans,sans-serif" role="img">`;
  s+=`<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" stroke="var(--graphite)" stroke-width="1"/></pattern>

  <pattern id="pP2" width="90" height="90" patternUnits="userSpaceOnUse"><rect width="90" height="90" fill="#9aa5ab" fill-opacity=".22"/><path d="M0 90H90V0" fill="none" stroke="#7d878d" stroke-opacity=".5" stroke-width=".8"/></pattern>
  <pattern id="pP3" width="120" height="60" patternUnits="userSpaceOnUse"><rect width="120" height="60" fill="#b8a98f" fill-opacity=".25"/><path d="M0 60H120V0" fill="none" stroke="#8d7f66" stroke-opacity=".5" stroke-width=".8"/></pattern></defs>`;
  // pisos / ambientes

    for(const [x1,y1,x2,y2] of r.rects){ const fill=layers.piso?`url(#p${r.piso})`:(focus===r.id?'var(--wood-soft)':'var(--sheet)');
      s+=`<rect x="${P(x1)}" y="${P(y1)}" width="${P(x2-x1)}" height="${P(y2-y1)}" fill="${fill}" ${dim?'opacity=".45"':''}/>`; } }
  // varanda em arco
  let arc=`M${P(arcX(ARC.y1))} ${P(ARC.y1)}`; for(let i=1;i<=40;i++){const y=ARC.y1+(ARC.y2-ARC.y1)*i/40;arc+=`L${P(arcX(y))} ${P(y)}`;}
  s+=`<path d="${arc}L${P(0.66)} ${P(ARC.y2)}L${P(0.66)} ${P(5.47)}L${P(-0.15)} ${P(5.47)}L${P(-0.15)} ${P(ARC.y1)}Z" fill="${layers.piso?'url(#pP3)':(focus==='varanda'?'var(--wood-soft)':'var(--sheet)')}" ${focus&&focus!=='varanda'?'opacity=".45"':''}/>`;
  s+=`<path d="${arc}" fill="none" stroke="var(--wall-int)" stroke-width="5"/><path d="${arc}" fill="none" stroke="var(--sheet)" stroke-width="2"/>`;
  // mobiliário
  if(layers.furn) for(const r of ROOMS) for(const it of r.furn||[]) s+=`<g ${focus&&focus!==r.id?'opacity=".35"':''}>${furnSVG(it)}</g>`;
  // paredes
  for(const w of WALLS){const [x1,y1,x2,y2]=w.r;const f=w.t==='int'?'var(--wall-int)':w.t==='shaft'?'url(#hatch)':'var(--wall)';
    s+=`<rect x="${P(x1)}" y="${P(y1)}" width="${P(x2-x1)}" height="${P(y2-y1)}" fill="${f}" ${w.t==='shaft'?'stroke="var(--wall)" stroke-width="1.5"':''}/>`;}
  // aberturas
  for(const o of OPENINGS){
    const w=WALLS.find(w=>{const [x1,y1,x2,y2]=w.r;const horiz=(x2-x1)>=(y2-y1);return (horiz?'h':'v')===o.a&&o.c>=(horiz?y1:x1)-0.01&&o.c<=(horiz?y2:x2)+0.01&&o.s>=(horiz?x1:y1)-0.01&&o.e<=(horiz?x2:y2)+0.01;});
    if(!w)continue; const [x1,y1,x2,y2]=w.r; const t1=o.a==='h'?y1:x1,t2=o.a==='h'?y2:x2;
    const R=(a,b,c,d,attr)=>o.a==='h'?`<rect x="${P(a)}" y="${P(c)}" width="${P(b-a)}" height="${P(d-c)}" ${attr}/>`:`<rect x="${P(c)}" y="${P(a)}" width="${P(d-c)}" height="${P(b-a)}" ${attr}/>`;
    const Lp=(a1,c1,a2,c2,attr)=>o.a==='h'?`<path d="M${P(a1)} ${P(c1)}L${P(a2)} ${P(c2)}" ${attr}/>`:`<path d="M${P(c1)} ${P(a1)}L${P(c2)} ${P(a2)}" ${attr}/>`;
    s+=R(o.s,o.e,t1,t2,'fill="var(--sheet)"');
    if(o.t==='win'||o.t==='pj'){ const m=(t1+t2)/2; s+=Lp(o.s,t1,o.e,t1,'stroke="var(--wall)" stroke-width="1"')+Lp(o.s,t2,o.e,t2,'stroke="var(--wall)" stroke-width="1"')+Lp(o.s,m,o.e,m,'stroke="#4a8aa3" stroke-width="2"');
      if(o.t==='pj'){const st=(o.e-o.s)/4;for(let i=0;i<4;i++)s+=Lp(o.s+i*st,m+(i%2?0.02:-0.02),o.s+(i+1)*st,m+(i%2?0.02:-0.02),'stroke="#4a8aa3" stroke-width="1.2"');} }
    if(o.t==='vao') s+=Lp(o.s,(t1+t2)/2,o.e,(t1+t2)/2,'stroke="var(--graphite)" stroke-width="1" stroke-dasharray="4 3"');
    if(o.t==='door'){ const wd=o.e-o.s; const jamb=o.sw>0?t2:t1; const hx=o.hg==='s'?o.s:o.e, ox=o.hg==='s'?o.e:o.s;
      const leafEnd=[hx,jamb+o.sw*wd], other=[ox,jamb];
      const toXY=(a,c)=>o.a==='h'?[a,c]:[c,a];
      const H0=toXY(hx,jamb),E0=toXY(...leafEnd),O0=toXY(...other);
      const ax=E0[0]-H0[0],ay=E0[1]-H0[1],bx=O0[0]-H0[0],by=O0[1]-H0[1];const sweep=(ax*by-ay*bx)>0?1:0;
      s+=`<path d="M${P(H0[0])} ${P(H0[1])}L${P(E0[0])} ${P(E0[1])}" stroke="var(--ink)" stroke-width="2.2"/><path d="M${P(E0[0])} ${P(E0[1])}A${P(wd)} ${P(wd)} 0 0 ${sweep} ${P(O0[0])} ${P(O0[1])}" fill="none" stroke="var(--graphite)" stroke-width="1" stroke-dasharray="3 3"/>`;
      if(o.leaf==='hidden') s+=R(o.s,o.e,(t1+t2)/2-0.012,(t1+t2)/2+0.012,'fill="var(--wood)"');
    }
  }
  // iluminação
  if(layers.ilum) for(const r of ROOMS){ for(const l of r.ilum||[]){ if(l.seg) for(const [x1,y1,x2,y2] of l.seg) s+=`<path d="M${P(x1)} ${P(y1)}L${P(x2)} ${P(y2)}" ${LEDSTYLE[l.s]||LEDSTYLE.led} fill="none"/>`;
      if(l.p) for(const [x,y] of l.p) s+=(SYM[l.s]||SYM.spot)(x,y); } }
  if(layers.elet) for(const r of ROOMS) for(const e of r.elet||[]) for(const [x,y] of e.p) s+=(SYM[e.s]||SYM.tug)(x,y,e.h);
  if(layers.hidr) for(const r of ROOMS) for(const e of r.hidr||[]) for(const [x,y] of e.p) s+=(SYM[e.s]||SYM.af)(x,y);
  // nomes
  if(layers.nomes!==false) for(const r of ROOMS){ if(focus&&focus!==r.id)continue; const [x1,y1,x2,y2]=r.rects.slice().sort((a,b)=>(b[2]-b[0])*(b[3]-b[1])-(a[2]-a[0])*(a[3]-a[1]))[0];
    let cx=(x1+x2)/2, cy=(y1+y2)/2; if(r.id==='sala'){cx=2.4;cy=5.85;} if(r.id==='suite'){cx=2.2;cy=2.42;} if(r.id==='quarto1'){cx=1.0;cy=4.35;} if(r.id==='office'){cx=6.45;cy=3.02;} if(r.id==='varanda'){cx=-0.62;cy=5.9;} if(r.id==='cozinha'){cx=7.65;cy=6.25;} if(r.id==='banho'){cx=4.55;cy=4.65;} if(r.id==='banhosuite'){cx=4.42;cy=1.40;} if(r.id==='circulacao'){cx=3.55;cy=4.65;} if(r.id==='hall'){cx=7.70;cy=8.10;} if(r.id==='servico'){cx=7.85;cy=3.75;} if(r.id==='wc'){cx=6.87;cy=4.62;}
    const vert=r.id==='circulacao'||r.id==='varanda';
    s+=`<g transform="translate(${P(cx)} ${P(cy)})${vert?' rotate(-90)':''}"><text text-anchor="middle" font-family="Archivo,Arial Narrow,sans-serif" font-weight="700" font-size="15" fill="var(--ink)" paint-order="stroke" stroke="var(--sheet)" stroke-width="4">${r.nome.split(' · ')[0].toUpperCase()}</text><text y="14" text-anchor="middle" font-size="11" fill="var(--graphite)" font-family="IBM Plex Mono,monospace" paint-order="stroke" stroke="var(--sheet)" stroke-width="3">${f2(area(r))} m²</text></g>`; }
  // cotas internas do ambiente em foco
  if(cotas&&focus){ const r=ROOM[focus]; for(const [x1,y1,x2,y2] of r.rects){ if(r.id==='varanda')break;
      const ty=y1+0.18, tx=x1+0.18;
      s+=`<g stroke="var(--cota)" stroke-width="1" fill="var(--cota)" font-family="IBM Plex Mono,monospace" font-size="11">
      <path d="M${P(x1)} ${P(ty)}H${P(x2)}M${P(x1)} ${P(ty)-5}V${P(ty)+5}M${P(x2)} ${P(ty)-5}V${P(ty)+5}"/><text x="${P((x1+x2)/2)}" y="${P(ty)-4}" text-anchor="middle" stroke="none" paint-order="stroke">${f2(x2-x1)}</text>
