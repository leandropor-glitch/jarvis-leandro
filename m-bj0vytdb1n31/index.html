<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1519">
<title>Monitor de limites</title>
<style>
  :root { --bg:#0E1519; --card:#17212A; --line:#26323B; --ink:#F2F5F7; --soft:#C1CFD9; --mute:#7E8B94; --acc:#E1FE06; --warn:#F5B942; --bad:#FF6B6B; --vazio:#2A3742; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { min-height: 100vh; display: flex; flex-direction: column; gap: 1.2vh; padding: 1.6vh 1.6vw; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 3px solid var(--acc); padding-bottom: .8vh; }
  h1 { margin: 0; font-size: clamp(18px, 2.2vw, 30px); font-weight: 700; letter-spacing: .02em; }
  h1 small { color: var(--acc); font-size: .55em; letter-spacing: .2em; display: block; }
  .stamp { color: var(--mute); font-size: clamp(12px, 1vw, 15px); text-align: right; cursor: pointer; }
  .lead { color: var(--soft); font-size: clamp(12px, .95vw, 15px); margin: 0; }
  .cab { display: grid; grid-template-columns: minmax(120px, 13vw) repeat(4, 1fr); gap: 1vw; color: var(--mute); font-size: clamp(12px, 1.05vw, 16px); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; text-align: center; }
  .grade { flex: 1; display: grid; grid-template-rows: repeat(5, 1fr); gap: 1vh; }
  .linha { display: grid; grid-template-columns: minmax(120px, 13vw) repeat(4, 1fr); gap: 1vw; align-items: stretch; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: .8vh 1vw; }
  .nome { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .nome b { font-size: clamp(16px, 1.7vw, 26px); display: flex; align-items: center; gap: 10px; }
  .nome i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; }
  .nome span { color: var(--mute); font-size: clamp(11px, .85vw, 13px); }
  .nome span.velho { color: var(--warn); }
  .cel { display: flex; align-items: center; gap: .8vw; min-width: 0; }
  .cel svg { height: 100%; max-height: 13vh; min-height: 64px; aspect-ratio: 1; flex: none; }
  .cel .tx { min-width: 0; font-size: clamp(11px, .85vw, 14px); color: var(--soft); line-height: 1.3; }
  .err { background: #2a1416; border: 1px solid #5a2326; color: #ffb3b5; padding: 10px 14px; border-radius: 12px; }
  @media (max-width: 760px) {
    .cab { display: none; }
    .linha { grid-template-columns: repeat(2, 1fr); }
    .nome { grid-column: 1 / -1; }
    .cel { flex-direction: column; text-align: center; }
    .cel svg { max-height: none; width: 42vw; max-width: 160px; height: auto; }
    .cel .tx::before { content: attr(data-p); display: block; font-weight: 700; color: var(--mute); letter-spacing: .1em; text-transform: uppercase; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>FELYX · VINCI</small>Quanto de cada limite já foi usado</h1>
    <div class="stamp" id="stamp" title="Toque para atualizar agora">carregando…</div>
  </header>
  <p class="lead">Pizza cheia = 100% do limite usado (estourou). Vazia = 0% (tudo livre). Cinza com aviso: o período não tem limite no plano, ou o serviço não mostra o uso. Atualiza sozinho a cada 15 minutos.</p>
  <div class="cab"><span></span><span>Sessão ativa</span><span>Dia</span><span>Semana</span><span>Mês</span></div>
  <div id="erro"></div>
  <div class="grade" id="grade"></div>
</div>
<script>
(function () {
  const API = 'https://vinciautomacao.app.n8n.cloud/webhook/felix/monitor';
  const A_CADA_MS = 15 * 60 * 1000;
  const SERVICOS = [['Claude', '#E8762B'], ['GPT', '#1FA463'], ['Gemini', '#2F6FED'], ['Live Avatar', '#8A4FD8'], ['n8n', '#E5408A']];
  const PERIODOS = [['sessao', 'Sessão ativa'], ['dia', 'Dia'], ['semana', 'Semana'], ['mes', 'Mês']];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const hora = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' }); };
  const ha = (iso) => { const m = Math.round((Date.now() - new Date(iso)) / 60000); if (isNaN(m)) return ''; if (m < 1) return 'agora'; if (m < 60) return 'há ' + m + ' min'; const h = Math.round(m / 60); return h < 48 ? 'há ' + h + ' h' : 'há ' + Math.round(h / 24) + ' dias'; };

  function pizza(d, cor) {
    const R = 46, C = 50;
    let s = '<svg viewBox="0 0 100 100" role="img"><circle cx="50" cy="50" r="' + R + '" fill="var(--vazio)"/>';
    if (d && d.estado === 'medido' && d.pct != null) {
      const p = Math.max(0, Math.min(100, Number(d.pct)));
      if (p >= 100) s += '<circle cx="50" cy="50" r="' + R + '" fill="' + cor + '"/>';
      else if (p > 0) {
        const a = 2 * Math.PI * p / 100, x = C + R * Math.sin(a), y = C - R * Math.cos(a);
        s += '<path d="M50 50 L50 ' + (C - R) + ' A' + R + ' ' + R + ' 0 ' + (p > 50 ? 1 : 0) + ' 1 ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Z" fill="' + cor + '"/>';
      }
      s += '<circle cx="50" cy="50" r="24" fill="var(--card)"/>';
      s += '<text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-size="' + (p >= 10 && p % 1 ? 15 : 18) + '" font-weight="800" fill="' + (p >= 90 ? 'var(--bad)' : p >= 70 ? 'var(--warn)' : 'var(--ink)') + '">' + p.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%</text>';
    } else {
      const sem = d && d.estado === 'sem_limite';
      s += '<text x="50" y="45" text-anchor="middle" font-size="11" font-weight="700" fill="var(--mute)">' + (d ? (sem ? 'sem limite' : 'sem medidor') : 'sem dados') + '</text>';
      s += '<text x="50" y="60" text-anchor="middle" font-size="10" fill="var(--mute)">' + (d ? (sem ? 'neste período' : 'no plano') : '') + '</text>';
    }
    return s + '</svg>';
  }

  function render(j) {
    const L = j.limites || [];
    $('grade').innerHTML = SERVICOS.map(([nome, cor]) => {
      const meus = L.filter((x) => x.servico === nome);
      const ultima = meus.map((x) => x.lido_em).filter(Boolean).sort().pop();
      const velho = ultima && (Date.now() - new Date(ultima)) > 3 * 3600e3;
      const celulas = PERIODOS.map(([p, rot]) => { const d = meus.find((x) => x.periodo === p); return '<div class="cel">' + pizza(d, cor) + '<div class="tx" data-p="' + esc(rot) + '">' + esc(d ? d.detalhe : 'sem dados') + '</div></div>'; }).join('');
      return '<div class="linha"><div class="nome"><b><i style="background:' + cor + '"></i>' + esc(nome) + '</b><span class="' + (velho ? 'velho' : '') + '">' + (ultima ? 'lido ' + esc(ha(ultima)) + ' · ' + esc(hora(ultima)) : 'sem leitura') + '</span></div>' + celulas + '</div>';
    }).join('');
    $('stamp').textContent = 'atualizado ' + hora(j.em || new Date().toISOString()) + ' (Brasília) · toque para atualizar';
    $('erro').innerHTML = '';
  }

  function carregar() {
    fetch(API, { cache: 'no-store' }).then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(render).catch((e) => {
      $('erro').innerHTML = '<div class="err">Não consegui ler os dados agora (' + esc(e.message) + '). Tento de novo em 15 minutos.</div>';
    });
  }
  $('stamp').onclick = carregar;
  carregar();
  setInterval(carregar, A_CADA_MS);
})();
</script>
</body>
</html>
